# LANStream — Deploy to VPS on push to main
#
# Requires repository secrets:
#   DEPLOY_SSH_KEY   — Private SSH key for the deploy user
#   DEPLOY_HOST      — VPS IP or hostname (212.47.73.237)
#   DEPLOY_USER      — SSH username (ubuntu)

name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          SSH_KEY: ~/.ssh/deploy_key
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'DEPLOY'
            cd /var/www/lanstream
            git fetch origin main
            git reset --hard origin/main
            cd infrastructure/compose
            sg docker -c "docker compose -f compose.prod.yaml --env-file ../.env up --no-deps migrate"
            sg docker -c "docker compose -f compose.prod.yaml --env-file ../.env up -d --build"
            sg docker -c "docker image prune -f"
            echo "✅ Deploy complete — $(date)"
          DEPLOY
