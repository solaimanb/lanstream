# LANStream — Development Compose
#
# Usage:
#   docker compose up          — start PostgreSQL
#   docker compose up -d       — start PostgreSQL in background
#   docker compose down        — stop and remove containers
#   docker compose down -v     — stop, remove, and delete volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: lanstream-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: lanstream
      POSTGRES_PASSWORD: lanstream_dev
      POSTGRES_DB: lanstream
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanstream -d lanstream"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
